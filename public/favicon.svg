<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wecare-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cross-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Modern Hospital Squircle Tile Base -->
  <rect width="64" height="64" rx="18" fill="url(#wecare-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />

  <!-- Clean Precision Medical Cross -->
  <g filter="url(#tile-shadow)">
    <!-- Vertical Cross Arm -->
    <rect x="25" y="13" width="14" height="38" rx="6" fill="url(#cross-fill)" />
    <!-- Horizontal Cross Arm -->
    <rect x="13" y="25" width="38" height="14" rx="6" fill="url(#cross-fill)" />
  </g>

  <!-- Dynamic Electrocardiogram / Clinical Heartbeat Vitality Line -->
  <path
    d="M 18 32 L 25 32 L 28.5 24 L 32.5 40 L 36 28 L 39 32 L 46 32"
    stroke="#0284c7"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- WeCare Luminous Cyan Vitality Beacon -->
  <circle cx="43.5" cy="20.5" r="4" fill="#38bdf8" />
  <circle cx="43.5" cy="20.5" r="2" fill="#ffffff" />
</svg>